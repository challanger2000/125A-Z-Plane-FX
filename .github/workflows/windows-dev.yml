name: Windows Z-Plane FX development build
on:
  push:
    branches: [develop/v0.1.0, feature/morpheus-ultraproteus-289-cubes]
    paths:
      - '.github/workflows/windows-dev.yml'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'tests/**'
      - 'LocalAcceptance/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact Steinberg VST3 SDK 3.8.1
        shell: pwsh
        run: |
          git clone --recursive --branch v3.8.1_build_84 --depth 1 https://github.com/steinbergmedia/vst3sdk.git sdk
          $actual=(git -C sdk rev-parse HEAD).Trim()
          if ($actual -ne '3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96') { throw "Wrong Steinberg SDK $actual" }
          $subs=git -C sdk submodule status --recursive
          if (@($subs).Count -eq 0 -or @($subs | Where-Object { $_ -notmatch '^ [0-9a-f]{40} ' }).Count -gt 0) { throw 'Incomplete SDK submodules' }
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DBUILD_TESTING=ON -DZPLANE_BUILD_VST3=ON -DZPLANE_WITH_X3_RESEARCH=ON -DZPLANE_VERIFY_MORPHOSIS_ORACLE=ON -DVST3_SDK_ROOT="$env:GITHUB_WORKSPACE/sdk"
          if ($LASTEXITCODE -ne 0) { throw 'Configuration failed' }
      - name: Reconstruct original X3 reference banks for this job only
        shell: pwsh
        run: |
          $research=Join-Path $env:GITHUB_WORKSPACE 'build/third_party_research/emulator-x3-filters'
          python tools/reconstruct_x3_banks.py --research "$research" --out "$research"
          if ($LASTEXITCODE -ne 0) { throw 'Original bank reconstruction/reference verification failed' }
          "ZPLANE_X3_BANK_DIR=$research" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build prototype, standalone tests and Steinberg Validator
        shell: pwsh
        run: |
          cmake --build build --config Release --target ZPlaneFX zplane_core_tests zplane_automation_tests zplane_dual_lfo_tests zplane_morpheus_tests zplane_filter_display_tests zplane_morpheus_oracle_tests zplane_native_host_tests zplane_x3_adapter_tests zplane_x3_real_adapter_tests zplane_x3_realtime_audit_tests zplane_x3_original_factory_reference zplane_x3_original_extended_reference validator --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'MSVC build failed' }
      - name: Actual Release-mode functional DSP tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'C++ DSP tests failed' }
      - name: Inspect Windows binary and construct standard VST3 bundle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $plugin=Get-ChildItem -Path build -Recurse -File -Filter '*.vst3' | Where-Object { $_.Name -eq '125A Z-Plane FX.vst3' } | Select-Object -First 1
          if (-not $plugin) { throw 'Built Windows VST3 binary missing' }
          $dest='artifact/125A Z-Plane FX.vst3/Contents/x86_64-win'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -LiteralPath $plugin.FullName -Destination (Join-Path $dest '125A Z-Plane FX.vst3')
          $resources='artifact/125A Z-Plane FX.vst3/Contents/Resources'
          New-Item -ItemType Directory -Force -Path $resources | Out-Null
          Copy-Item -LiteralPath 'resource/ZPlane.uidesc' -Destination (Join-Path $resources 'ZPlane.uidesc')
          $ui=Get-Content (Join-Path $resources 'ZPlane.uidesc') -Raw | ConvertFrom-Json
          if (-not $ui.'vstgui-ui-description'.templates.ZPlaneMain) { throw 'Native VSTGUI main layout missing' }
          $binary=Join-Path $dest '125A Z-Plane FX.vst3'
          if ((Get-Item $binary).Length -lt 100000) { throw 'Implausibly small VST3 binary' }
          $head=[IO.File]::ReadAllBytes((Resolve-Path $binary))
          if ($head[0] -ne 77 -or $head[1] -ne 90) { throw 'Not a Windows PE file' }
          $validator=Get-ChildItem -Path build -Recurse -File -Filter validator.exe | Select-Object -First 1
          if (-not $validator) { throw 'Official Steinberg validator unavailable' }
          # Early process-level differential diagnosis: the native host creates the
          # controller and editor before validator, catching lifecycle corruption.
          $native='build/Release/zplane_native_host_tests.exe'
          if (Test-Path $native) {
            Write-Host 'DIAG: native embedded host before Steinberg validator'
            & $native $binary '--embedded-smoke'
            Write-Host "DIAG: native host exit=$LASTEXITCODE"
            if (Test-Path 'ZPLANE-CONTROLLER-DIAG.log') {
              Get-Content 'ZPLANE-CONTROLLER-DIAG.log' | Select-Object -Last 100
            }
          }
          & $validator.FullName (Resolve-Path 'artifact/125A Z-Plane FX.vst3').Path
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Validator diagnostic temp path: $env:TEMP"
            $diag=Join-Path $env:TEMP 'ZPLANE-CONTROLLER-DIAG.log'
            if (Test-Path $diag) { Get-Content -Path $diag }
            Get-ChildItem -Path '.' -File -Recurse -Filter 'ZPLANE-CONTROLLER-DIAG.log' -ErrorAction SilentlyContinue | ForEach-Object { Get-Content -LiteralPath $_.FullName }
            throw "Steinberg Validator failed on final staged bundle, exit=$LASTEXITCODE"
          }
      - name: Native packaged host audio, automation and recall
        shell: pwsh
        run: |
          $binary=(Resolve-Path 'artifact/125A Z-Plane FX.vst3/Contents/x86_64-win/125A Z-Plane FX.vst3').Path
          & 'build/Release/zplane_native_host_tests.exe' $binary
          if ($LASTEXITCODE -ne 0) { throw 'Native host integration failed' }
      - name: Clean-profile 55-filter embedded X3 test (NO external banks)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $binary=(Resolve-Path 'artifact/125A Z-Plane FX.vst3/Contents/x86_64-win/125A Z-Plane FX.vst3').Path
          $bank=$env:ZPLANE_X3_BANK_DIR
          $local=$env:LOCALAPPDATA
          try {
            Remove-Item Env:ZPLANE_X3_BANK_DIR -ErrorAction SilentlyContinue
            $env:LOCALAPPDATA=Join-Path $env:RUNNER_TEMP 'ZPlane-Clean-Test-Profile'
            New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
            & 'build/Release/zplane_native_host_tests.exe' $binary '--embedded-smoke'
            if ($LASTEXITCODE -ne 0) { throw 'Embedded X3 filters failed without any bank files' }
          } finally {
            $env:LOCALAPPDATA=$local
            if ($bank) { $env:ZPLANE_X3_BANK_DIR=$bank }
            else { Remove-Item Env:ZPLANE_X3_BANK_DIR -ErrorAction SilentlyContinue }
          }
          Write-Host '[PASS] ALL 55 X3 filters available solely from DLL resources'
      - name: Independent pinned 125A Plugin Test Lab universal technical baseline
        if: contains(github.event.head_commit.message, '[test-lab]')
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git clone --depth 1 --branch main https://github.com/challanger2000/125A-Plugin-Test-Lab.git lab
          if ($LASTEXITCODE -ne 0) { throw 'Test Lab checkout failed' }
          # Pin the tested merged source COMMIT, not the moving main HEAD:
          # subsequent fixture/documentation commits must not silently
          # change the binary tested here or block this already approved pin.
          git -C lab fetch --depth 1 origin 58dc3ba730bb6297ddf7636254d62d16d5bd7f9e
          if ($LASTEXITCODE -ne 0) { throw 'Immutable Test Lab source SHA fetch failed' }
          git -C lab checkout --detach 58dc3ba730bb6297ddf7636254d62d16d5bd7f9e
          if ($LASTEXITCODE -ne 0) { throw 'Immutable Test Lab source checkout failed' }
          $labSha=(git -C lab rev-parse HEAD).Trim()
          if ($labSha -ne '58dc3ba730bb6297ddf7636254d62d16d5bd7f9e') {
            throw "Unreviewed Test Lab version $labSha"
          }
          cmake -S lab -B lab-build -A x64 -DFETCHCONTENT_SOURCE_DIR_VST3SDK="$env:GITHUB_WORKSPACE/sdk"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Test Lab configuration failed' }
          cmake --build lab-build --config Release --target TestLabGUI TestLabHost TestLabStateStress --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Independent Test Lab native hosts failed to compile' }
          $gui=@(Get-ChildItem lab-build -Recurse -File -Filter '125A_Test_Lab_GUI.exe')
          $audio=@(Get-ChildItem lab-build -Recurse -File -Filter '125A_Test_Lab_Host.exe')
          $stress=@(Get-ChildItem lab-build -Recurse -File -Filter '125A_Test_Lab_State_Stress.exe')
          if ($gui.Count -ne 1 -or $audio.Count -ne 1 -or $stress.Count -ne 1) {
            throw 'Exactly one native Test Lab executable per required host must exist'
          }
          $plugin=(Resolve-Path 'artifact/125A Z-Plane FX.vst3').Path
          $PSNativeCommandUseErrorActionPreference=$false
          python lab/tests/run_universal_qa.py --plugin "$plugin" --gui-host "$($gui[0].FullName)" --audio-host "$($audio[0].FullName)" --stress-host "$($stress[0].FullName)" --run-technical-baseline --timeout 110 --out lab-evidence
          $exitCode=$LASTEXITCODE
          if (-not (Test-Path 'lab-evidence/UNIVERSAL-QA-RESULT.json')) {
            throw "Independent Test Lab produced no results (exit $exitCode)"
          }
          $report=Get-Content 'lab-evidence/UNIVERSAL-QA-RESULT.json' -Raw | ConvertFrom-Json
          if ($exitCode -ne 0 -or $report.status -ne 'TECHNICAL_BASELINE_PASS' -or
              $report.discovery -ne 'PASS' -or $report.native_technical -ne 'PASS' -or
              $report.required_feature_coverage -ne 'NOT DECLARED' -or
              $report.release_approved -ne $false) {
            throw "Universal Test Lab technical baseline failed or overstated results: $($report.status)"
          }
          Write-Host '125A Test Lab TECHNICAL_BASELINE_PASS (no real DAW/ASIO or commercial release claim)'
      - name: Retain independent Test Lab evidence
        if: always() && contains(github.event.head_commit.message, '[test-lab]')
        uses: actions/upload-artifact@v4
        with:
          name: 125A-ZPlaneFX-Independent-Test-Lab-P74-Evidence
          path: lab-evidence/
          if-no-files-found: warn
          retention-days: 4
      - name: Upload DEVELOPMENT build, never mark as release
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Z-Plane-FX-v0.1.0-PROTOTYPE-WINDOWS
          path: artifact/
          retention-days: 4
      - name: Stage native Windows test executables for owner-local QA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path 'native-acceptance' -Force | Out-Null
          foreach ($name in @('zplane_core_tests.exe','zplane_automation_tests.exe','zplane_dual_lfo_tests.exe','zplane_morpheus_tests.exe',
               'zplane_filter_display_tests.exe','zplane_morpheus_oracle_tests.exe',
              'zplane_x3_adapter_tests.exe','zplane_x3_real_adapter_tests.exe',
              'zplane_x3_realtime_audit_tests.exe','zplane_native_host_tests.exe')) {
            $item=@(Get-ChildItem build -File -Recurse -Filter $name)
            if ($item.Count -ne 1) { throw "Expected one compiled native test executable: $name, found $($item.Count)" }
            Copy-Item -LiteralPath $item[0].FullName -Destination (Join-Path 'native-acceptance' $name)
          }
      - name: Preserve native owner-local QA executables
        uses: actions/upload-artifact@v4
        with:
          name: 125A-ZPlaneFX-NATIVE-TEST-EXE-WINDOWS
          path: native-acceptance/
          retention-days: 7

  local-acceptance-kit:
    needs: build-and-test
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Obtain exact VST3 and native test executables from THIS run
        uses: actions/download-artifact@v4
        with:
          name: 125A-Z-Plane-FX-v0.1.0-PROTOTYPE-WINDOWS
          path: package/Plugin
      - name: Obtain exact native tests from THIS run
        uses: actions/download-artifact@v4
        with:
          name: 125A-ZPlaneFX-NATIVE-TEST-EXE-WINDOWS
          path: package/Native
      - name: Build independent 125A Test Lab Windows EXEs from immutable merged main
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git clone --recursive --depth 1 --branch v3.8.1_build_84 https://github.com/steinbergmedia/vst3sdk.git sdk
          if ($LASTEXITCODE -ne 0) { throw 'Steinberg SDK download failed' }
          $sdkSha=(git -C sdk rev-parse HEAD).Trim()
          if ($sdkSha -ne '3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96') {
            throw "Unexpected SDK version $sdkSha"
          }
          git clone --depth 1 --branch main https://github.com/challanger2000/125A-Plugin-Test-Lab.git lab
          if ($LASTEXITCODE -ne 0) { throw 'Test Lab source download failed' }
          git -C lab fetch --depth 1 origin 58dc3ba730bb6297ddf7636254d62d16d5bd7f9e
          if ($LASTEXITCODE -ne 0) { throw 'Immutable Lab SHA unavailable' }
          git -C lab checkout --detach 58dc3ba730bb6297ddf7636254d62d16d5bd7f9e
          if ($LASTEXITCODE -ne 0) { throw 'Cannot pin merged Lab source' }
          $labSha=(git -C lab rev-parse HEAD).Trim()
          if ($labSha -ne '58dc3ba730bb6297ddf7636254d62d16d5bd7f9e') {
            throw "Unreviewed Lab revision $labSha"
          }
          cmake -S lab -B lab-build -A x64 -DFETCHCONTENT_SOURCE_DIR_VST3SDK="$env:GITHUB_WORKSPACE/sdk"
          if ($LASTEXITCODE -ne 0) { throw 'Lab configure failed' }
          cmake --build lab-build --config Release --target TestLabGUI TestLabHost TestLabStateStress --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Lab build failed' }
          New-Item -ItemType Directory -Path 'package/TestLab' -Force | Out-Null
          foreach ($name in @('125A_Test_Lab_GUI.exe','125A_Test_Lab_Host.exe',
                '125A_Test_Lab_State_Stress.exe')) {
            $item=@(Get-ChildItem lab-build -File -Recurse -Filter $name)
            if ($item.Count -ne 1) { throw "Expected one built Lab host: $name, got $($item.Count)" }
            Copy-Item -LiteralPath $item[0].FullName -Destination (Join-Path 'package/TestLab' $name)
          }
      - name: Compose per-user safe test kit and immutable SHA-256 manifest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Copy-Item -Path 'LocalAcceptance/*' -Destination 'package' -Recurse -Force
          New-Item -ItemType Directory -Path 'package/Banks' -Force | Out-Null
          'No third-party bank files redistributed. Supply your own legitimate original banks.' |
            Set-Content -LiteralPath 'package/Banks/BANKS-NOT-INCLUDED.txt'
          $packageRoot=(Resolve-Path package).Path
          $items=@(Get-ChildItem 'package/Plugin','package/Native','package/TestLab' -Recurse -File)
          if ($items.Count -lt 9) { throw "Incomplete owner-local package; only $($items.Count) binaries/resources" }
          $proof=@($items | ForEach-Object {
            [pscustomobject]@{
              path=$_.FullName.Substring($packageRoot.Length+1).Replace('\','/')
              sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
            }
          })
          [pscustomobject]@{
            plugin_source_commit="$env:GITHUB_SHA"
            test_lab_source_commit='58dc3ba730bb6297ddf7636254d62d16d5bd7f9e'
            never_release=$true
            files=$proof
          } | ConvertTo-Json -Depth 8 |
            Set-Content -LiteralPath 'package/SHA256-MANIFEST.json' -Encoding UTF8
          $binary='package/Plugin/125A Z-Plane FX.vst3/Contents/x86_64-win/125A Z-Plane FX.vst3'
          if (-not (Test-Path -LiteralPath $binary)) { throw 'Exact staged Windows VST3 bundle not in package' }
          if (-not (Test-Path 'package/Tools/Run-Local-Tests.ps1')) { throw 'Local Windows harness absent' }
      - name: Actually run owner-local BAT/PowerShell harness on Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & 'package/00-START-TEST.bat' -CI
          if ($LASTEXITCODE -ne 0) { throw 'Owner-local BAT acceptance failed' }
          $results=@(Get-ChildItem 'package/Reports' -Recurse -File -Filter ACCEPTANCE.json)
          if ($results.Count -ne 1) { throw 'No unique completed local acceptance report' }
          $proof=Get-Content $results[0].FullName -Raw | ConvertFrom-Json
          if ($proof.status -ne 'PARTIAL_X3_REFERENCE_NOT_RUN' -or
              $proof.actual_asio -ne 'NOT RUN' -or $proof.python_required -ne $false) {
            throw "Owner-local test falsely overclaimed full X3 or ASIO certification: $($proof.status)"
          }
          if (@($proof.checks | Where-Object { $_.status -eq 'FAIL' }).Count -gt 0) {
            throw 'Owner-local harness reported a failed stage'
          }
          Write-Host '[PASS] BAT, test binaries, real stereo insert P25, GUI and SHA-256 verification'
          Write-Host '[PASS] Embedded 55 modes tested without any bank files'
          Write-Host '[NOT RUN] Optional external oracle absent; physical ASIO still NOT RUN'
      - name: Produce one self-contained owner-download ZIP (no Python needed)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item 'package/Reports' -Recurse -Force
          Compress-Archive -Path 'package/*' -DestinationPath '125A-ZPlaneFX-Windows-LOCAL-ABNAHME.zip' -CompressionLevel Optimal
          if ((Get-Item '125A-ZPlaneFX-Windows-LOCAL-ABNAHME.zip').Length -lt 500000) {
            throw 'Unexpectedly small Windows local acceptance kit'
          }
      - name: Upload Windows package for owner testing (DEVELOPMENT ONLY)
        uses: actions/upload-artifact@v4
        with:
          name: 125A-ZPlaneFX-Windows-LOCAL-ABNAHME-NO-PYTHON
          path: 125A-ZPlaneFX-Windows-LOCAL-ABNAHME.zip
          retention-days: 14
