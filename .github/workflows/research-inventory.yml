name: Research ZIP inventory (no code publication)
on:
  push:
    branches: [develop/v0.1.0]
    paths: ['.github/workflows/research-inventory.yml']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: List and classify external research package
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 'https://raw.githubusercontent.com/noneofyourbisness/EMU-Emulator-X3-ZPlaneFilter-Research/main/emulator-x3-filter-source.zip' -o /tmp/research.zip
          echo 'ARCHIVE SHA256:'; sha256sum /tmp/research.zip
          echo 'ARCHIVE CONTENTS (first 170 paths):'
          unzip -Z1 /tmp/research.zip | head -170 || true
          mkdir -p /tmp/research
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          z=ZipFile('/tmp/research.zip')
          entries=z.infolist()
          print('ENTRY COUNT:',len(entries))
          print('ARCHIVE SIZE:',sum(e.file_size for e in entries))
          for e in entries:
              if e.file_size>4_000_000: print('LARGE ENTRY',e.filename,e.file_size)
          names=[e.filename for e in entries if any(e.filename.lower().endswith(x) for x in ('.cpp','.hpp','.h','.c','.py','.json','.md','.txt','.bin','.dat','.npy','.npz'))]
          print('RELEVANT FILES:',len(names))
          for n in names[:220]:print('FILE',n)
          print('POTENTIAL LICENSES:')
          for n in names:
              if any(x in n.lower().split('/')[-1] for x in ['license','copying','notice']):
                  print(n)
          print('C++ FILTER SYMBOL / API INVENTORY:')
          for n in names:
              if not n.lower().endswith(('.cpp','.hpp','.h','.c')):continue
              if z.getinfo(n).file_size>2_000_000:continue
              s=z.read(n).decode('utf8','replace')
              import re
              symbols=set(re.findall(r'(?m)^\s*(?:class|struct|enum(?: class)?)\s+([A-Za-z_][A-Za-z_0-9]*)',s))
              matches=[x for x in symbols if any(k in x.lower() for k in ['filter','morph','coefficient','bank','engine','voice'])]
              if matches:print(n,':',','.join(sorted(matches)[:30]))
          PY
